name: release

# Push a tag vX.Y.Z → GitHub release with SHA256SUMS of all scripts (paths relative to the repo root).
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: SHA256SUMS
        run: find . -name '*.sh' -not -path './.git/*' -not -path './_template/*' | sed 's|^\./||' | sort | xargs -r sha256sum > SHA256SUMS
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" SHA256SUMS --title "$GITHUB_REF_NAME" --generate-notes
